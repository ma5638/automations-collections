name: Weekly Claude AI Threat Briefing

on:
  schedule:
    - cron: "30 6 * * 1"    # Monday 06:30 UTC = 10:30am GMT+4
  workflow_dispatch:          # run manually from GitHub UI anytime

permissions:
  id-token: write

jobs:
  claude-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load previously shared links
        id: seen
        env:
          WEB_API_URL: ${{ vars.WEB_API_URL }}
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
        run: |
          LINKS=$(curl -sS "$WEB_API_URL/state/automations-collections/claude-briefing-seen-links" \
            -H "Authorization: Bearer $WEB_API_KEY" \
            | python3 -c "import json, sys; data = json.load(sys.stdin).get('value') or []; print(chr(10).join(data) if data else '(none yet)')")
          {
            echo "links<<SEENLINKSEOF"
            echo "$LINKS"
            echo "SEENLINKSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ask Claude for the briefing
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975  # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Search the web for the past week's top cybersecurity threats and
            risks. Include 1-2 items on specific vulnerabilities (CVEs, patches,
            exploits) with brief technical detail, 1-2 on broader risks or
            threats, and 1-2 on threat modelling (breaches, ransomware, malware
            campaigns, nation-state activity, advisories). For each item, write
            a 1-2 sentence summary of what happened and why it matters, and
            include the source URL. Separate items with a blank line. Do not
            include a title or preamble.

            Do not reuse any of the following URLs — they were already shared
            in a previous briefing, so find different stories or different
            sources instead:
            ${{ steps.seen.outputs.links }}

            Write the complete briefing text, and nothing else, to a file
            named briefing_output.md in the current directory.
          claude_args: |
            --model claude-haiku-4-5
            --allowedTools "WebSearch,Write"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEB_API_URL: ${{ vars.WEB_API_URL }}
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
        run: python scripts/post_claude_briefing.py
